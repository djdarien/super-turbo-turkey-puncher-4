<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Turbo Turkey Puncher 4</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="main-menu">
    <img src="logo.png" alt="Super Turbo Turkey Puncher 4" class="logo">
    <p class="tagline">PUNCH THE TURKEY</p>
    <button id="start-btn">Start Game</button>
    <button id="scores-btn">High Scores</button>
  </div>
  
  <canvas id="gameCanvas"></canvas>
  
  <div id="hud">
    <div id="score-display">Score: 0</div>
    <div id="combo-display"></div>
  </div>

  <div id="pause-menu" class="overlay">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
    <button id="menu-btn">Main Menu</button>
  </div>

  <div id="high-score" class="overlay">
    <h2>High Scores</h2>
    <ol id="high-score-list"></ol>
    <button id="back-btn">Back</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
